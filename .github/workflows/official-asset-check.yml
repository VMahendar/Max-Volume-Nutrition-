name: Manufacturer image availability QA
on:
  push:
    branches: [feat/verified-november-stock-unicorn-photos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/official-asset-check.mjs
