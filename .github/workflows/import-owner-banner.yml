name: Import exact owner landscape banner
on:
  push:
    branches:
      - design/owner-full-landscape-banner-20261115
    paths:
      - .github/workflows/import-owner-banner.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/owner-full-landscape-banner-20261115
          persist-credentials: true
      - name: Fetch exact owner-supplied artwork
        env:
          SOURCE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a89c-8211-ae82-9205a1131514/raw?se=2026-11-14T20%3A54%3A41Z&sp=r&sv=2026-06-06&sr=b&scid=2fc2cc40-d167-5a37-b415-50151e25fc85&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T02%3A30%3A32Z&ske=2026-11-15T02%3A30%3A32Z&sks=b&skv=2026-06-06&sig=WPWuufD3cO6Jj/ZOGIOW%2BZVv6hbHHhSFus/DvSlLbFs%3D"
        run: |
          curl --fail --location --silent --show-error --retry 2 "$SOURCE_URL" --output /tmp/owner-banner.png
          file /tmp/owner-banner.png
      - name: Optimize owner artwork without recreating any packaging
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check pillow==11.2.1
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('/tmp/owner-banner.png')
          assert source.size==(1753,897),f'Unexpected owner image size: {source.size}'
          dest=Path('public/assets/mvn-owner-landscape-banner.webp')
          source.convert('RGB').save(dest,'WEBP',quality=82,method=6)
          print('Saved original owner art:',dest,'bytes:',dest.stat().st_size)
          PY
      - name: Commit exact image to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/mvn-owner-landscape-banner.webp
          git commit -m 'Add exact owner-designed MVN product group banner as WebP'
          git push origin HEAD:design/owner-full-landscape-banner-20261115
