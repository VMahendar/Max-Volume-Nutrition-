name: Inspect saved Google Rich Results report TYwXo6
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/inspect-rich-results-TYwXo6.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact shared Google test and classify messages
        run: |
          node --input-type=module <<'NODE'
          const id='TYwXo6BteQZlFpnpzqzrig';
          for(const type of ['', 'r%2Fproduct-snippets', 'r%2Fmerchant-listings', 'r%2Forganization-info', 'r%2Flocal-business','r%2Fbreadcrumbs']){
            const url='https://search.google.com/test/rich-results/result/'+type+(type?'?id=':'?id=')+id;
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(20000)});
              const html=await response.text();
              const plain=html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#x27;/g,"'").replace(/\s+/g,' ');
              const pos=plain.indexOf('Detected items');
              const found=[...plain.matchAll(/.{0,80}(?:non-critical issues?|critical issues?|invalid items?|valid items?|Missing field|Error XHR|Other error|Googlebot blocked|Crawled successfully|Page fetch).{0,180}/gi)].slice(0,30).map(x=>x[0]);
              console.log('REPORT',type||'MAIN',JSON.stringify({status:response.status,url:response.url,bytes:html.length,detected:pos<0?'':plain.slice(pos,pos+3000),messages:found}).slice(0,10000));
            }catch(e){console.log('REPORT_ERROR',type,String(e));}
          }
          NODE
