name: Build responsive original product images
on:
  push:
    branches:
      - perf/lighthouse-image-css-cache-20261115
    paths:
      - .github/workflows/build-responsive-product-images.yml
      - public/assets/mvn-homepage-banner-20261115.webp
permissions:
  contents: write
jobs:
  optimize-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/lighthouse-image-css-cache-20261115
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Resize exact original banner and verified official Blueberry pack
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          from urllib.request import Request,urlopen
          p=Path('public/assets')
          source=p/'mvn-homepage-banner-20261115.webp'
          with Image.open(source) as original:
              original.load()
              assert original.width==1672 and original.height==941, (original.width,original.height)
              for width in (768,1152):
                  height=round(original.height*width/original.width)
                  result=original.convert('RGB').resize((width,height),Image.Resampling.LANCZOS)
                  target=p/f'mvn-homepage-banner-20261115-{width}.webp'
                  result.save(target,'WEBP',quality=80,method=6)
                  print('Banner variant:',target, target.stat().st_size)
          url='https://revakanya.com/assets/imgs/Pro%20Creatine%20Blueberry.png'
          try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 MVN-original-photo-optimization'})
              with urlopen(req,timeout=25) as response:
                  data=response.read(7_000_001)
              if len(data)>7_000_000: raise ValueError('Image unexpectedly large')
              with Image.open(BytesIO(data)) as original:
                  original.load()
                  if original.width<250 or original.height<250 or original.width>5000 or original.height>5000:
                      raise ValueError('Unexpected original pack dimensions')
                  width=min(original.width,530)
                  height=round(original.height*width/original.width)
                  result=original.convert('RGBA').resize((width,height),Image.Resampling.LANCZOS)
                  target=p/'mvn-creatine-blueberry-official-250g.webp'
                  result.save(target,'WEBP',quality=86,method=6)
                  print('Original Blueberry image converted:',target,target.stat().st_size)
          except Exception as error:
              print('Official Blueberry image unavailable; keeping existing remote URL:',error)
          PY
      - name: Commit converted original product media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/mvn-homepage-banner-20261115-768.webp public/assets/mvn-homepage-banner-20261115-1152.webp
          if test -f public/assets/mvn-creatine-blueberry-official-250g.webp; then git add public/assets/mvn-creatine-blueberry-official-250g.webp; fi
          if ! git diff --cached --quiet; then
            git commit -m "Optimize original product photos for responsive delivery"
            git push origin HEAD:perf/lighthouse-image-css-cache-20261115
          fi
