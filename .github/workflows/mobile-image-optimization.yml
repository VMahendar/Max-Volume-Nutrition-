name: Prepare optimized storefront mobile photos
on:
  push:
    branches:
      - perf/mobile-lcp-webp-20261115
    paths:
      - .github/workflows/mobile-image-optimization.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mobile-lcp-webp-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize owner-approved original product pictures
        run: node deploy/prepare-product-media.mjs
      - name: Create responsive WebP derivatives
        run: python scripts/optimize-storefront-images.py
      - name: Commit only the generated image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/mvn-owner-landscape-banner-mobile.webp
          git add public/assets/mvn-hero-creatine-cutout-card.webp
          git add public/assets/mvn-hero-whey-cutout-card.webp
          git add public/assets/mvn-hero-nitro-cutout-card.webp
          git add public/assets/pro-creatine-card.webp
          git add public/assets/sturdy-watermelon-front-card.webp
          git add public/assets/IMG-20261102-WA0019-card.webp
          git diff --cached --quiet || git commit -m "Add compressed mobile versions of original approved MVN images"
          git push origin HEAD:perf/mobile-lcp-webp-20261115
