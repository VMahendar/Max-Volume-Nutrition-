name: Current manufacturer pack visual review
on:
  push:
    branches: [feat/verified-november-stock-unicorn-photos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/download-official-packs.mjs
      - run: python -m pip install Pillow --quiet
      - run: python tests/official-pack-sheet.py
      - run: python tests/repo-media-sheet.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-unicorn-pack-contact-sheet
          path: reports/official-photo-research/
          retention-days: 5
